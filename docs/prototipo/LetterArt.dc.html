<div style="{{paperStyle}}">

<p style="margin: 0">Esta es mi lista de regalos:</p>
<ol style="margin: 0; padding-left: 30px">
<sc-for list="{{giftList}}" as="g" hint-placeholder-count="3"><li>{{g.text}}</li></sc-for>
</ol>
<sc-if value="{{noGifts}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; opacity: 0.5">(Tu lista aparecerá aquí)</p></sc-if>

<p style="{{signStyle}}">{{signOff}}</p>
</sc-if>

<script type="text/x-dc" data-dc-script data-props='{"design":{"editor":"enum","options":["clasica","taller","estrellas","polonorte","juguetes"],"default":"clasica"},"mini":{"editor":"boolean","default":false},"greeting":{"editor":null},"intro":{"editor":null},"message":{"editor":null},"gifts":{"editor":null},"farewell":{"editor":null},"signOff":{"editor":null},"dim":{"editor":null},"$preview":{"width":520,"height":700}}'>
var LA = {
  clasica: {
    root: 'background: repeating-linear-gradient(45deg,#C8302B 0 22px,#F7F1E3 22px 34px,#2F8A4A 34px 56px,#F7F1E3 56px 68px); padding: 22px;',
    paper: 'background-color: #FBF6EA; background-image: radial-gradient(rgba(170,150,110,0.12) 1px, transparent 1.6px); background-size: 9px 11px; padding: 150px 34px 96px;',

  taller: {

    paper: 'background-color: #F5E8CD; background-image: radial-gradient(ellipse at center, rgba(255,255,255,0.4), rgba(160,110,50,0.18)); padding: 32px 30px 40px; border-radius: 4px; box-shadow: 0 6px 16px rgba(40,20,0,0.35);',
    line: '#DCC69C', ink: '#3A2614',

  },
  estrellas: {
    root: 'background: radial-gradient(#FFFFFF 1.2px, transparent 1.7px) 0 0/38px 38px, radial-gradient(#F5C84B 1.6px, transparent 2px) 19px 23px/61px 61px, #1B3A57; padding: 76px 62px 84px;',
    paper: 'background-color: #FFFFFF; padding: 40px 30px 40px;',
    line: '#C7DCE0', ink: '#1F2A44',
    greet: "font-family: 'Patrick Hand', cursive; font-size: 30px; color: #1B3A57; line-height: 64px;",

  polonorte: {

  },
  juguetes: {

    sign: "font-family: 'Patrick Hand', cursive; font-size: 26px; color: #E07272;"
  }
};
class Component extends DCLogic {
  renderVals() {

    var gifts = Array.isArray(p.gifts) ? p.gifts : [];
    return {
      isClasica: id === 'clasica', isTaller: id === 'taller', isEstrellas: id === 'estrellas', isPolo: id === 'polonorte', isJuguetes: id === 'juguetes',

      paperStyle: 'position: relative; z-index: 1; flex: 1; box-sizing: border-box; display: flex; flex-direction: column; ' + s.paper,
      contentStyle: 'font-family: \'Patrick Hand\', cursive; font-size: 21px; line-height: 32px; color: ' + s.ink + '; flex: 1; display: flex; flex-direction: column; overflow-wrap: anywhere; background-image: repeating-linear-gradient(to bottom, transparent 0 31px, ' + s.line + ' 31px 32px); background-position: 0 0;',
      greetStyle: 'margin: 0; ' + s.greet,
      signStyle: 'margin: 0; ' + s.sign,
      full: !mini,
      greeting: p.greeting || 'Querido Santa:',
      intro: p.intro || '',
      message: p.message || '',

      giftList: gifts.map(function (g) { return { text: g }; }),
      noGifts: !mini && gifts.length === 0,
      farewell: p.farewell || '',
      signOff: p.signOff || ''
    };
  }
}
